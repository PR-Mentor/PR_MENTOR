
name: Deploy PR Mentor Frontend

on:
  push:
    branches:
      - main
      - feature
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Supabase build configuration
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLIC_KEY" ]; then
            echo "Missing GitHub Actions repository variables: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          case "$SUPABASE_PUBLIC_KEY" in
            sb_secret_*)
              echo "VITE_SUPABASE_ANON_KEY must contain a publishable key, never a secret key."
              exit 1
              ;;
          esac
          case "$SUPABASE_URL" in
            */rest/v1/) SUPABASE_URL="${SUPABASE_URL%/}" ;;
          esac
          case "$SUPABASE_URL" in
            */rest/v1) SUPABASE_URL="${SUPABASE_URL%/rest/v1}" ;;
          esac
          case "$SUPABASE_URL" in
            https://*|http://localhost:*|http://127.0.0.1:*) ;;
            *)
              echo "VITE_SUPABASE_URL must be a valid Supabase project URL."
              exit 1
              ;;
          esac

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pr-mentor.onrender.com
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

